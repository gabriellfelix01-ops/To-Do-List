<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <!-- links -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/scripts.js" defer></script>
    <script src="https://kit.fontawesome.com/91edc14904.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="container">
        <header>
            <h1>Lista de Tarefas</h1>
            <small>Organize suas tarefas e seja mais produtivo!</small>
        </header>

        <div id="inputs">
            <input type="text" name="text" id="input-text" placeholder= "Adicionar uma nova tarefa">
            <button id="button-submit"><i class="fa-solid fa-circle-plus"></i> Adicionar</button>
        </div>
        <section id="list-table">
            <ul>
            </ul>
        </section>
        <hr>
        <footer>
            <p><span><i class="fa-solid fa-list-check"></i></span> X tarefas restantes</p>
        </footer>
    </div>
    
</body>
</html>
